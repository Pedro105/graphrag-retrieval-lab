name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts eval
      - run: uv run ruff format --check src tests scripts eval
      - run: uv run mypy src
      - run: uv run pytest tests/unit

  integration:
    name: Integration tests (FalkorDB)
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Placeholders: tests that need real LLM/embedding calls skip themselves.
      ANTHROPIC_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/integration
