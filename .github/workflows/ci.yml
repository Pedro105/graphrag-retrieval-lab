name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts eval
      - run: uv run ruff format --check src tests scripts eval
      - run: uv run mypy src
      - run: uv run pytest tests/unit

  integration:
    name: Integration tests (Neo4j)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.10.2-community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/graphrag-lab-dev
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    # No LLM key in CI: tests that need real extraction skip themselves.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/integration
