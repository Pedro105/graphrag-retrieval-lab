[project]
name = "graphrag-lab"
version = "0.2.0"
description = "Research testbed for GraphRAG retrieval over LLM-extracted knowledge graphs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "instructor>=1.3",
    "anthropic>=0.34",
    "openai>=1.35",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

# CPU-only PyTorch wheels: GPU builds pull several GB of CUDA libraries that
# neither CI nor the embedding/GNN workloads here need.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
