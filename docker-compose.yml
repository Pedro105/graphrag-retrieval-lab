# Local stack.
#   docker compose up -d neo4j   # graph store only (develop/test on the host)
#   docker compose up -d         # graph store + API on :8000
#
# Neo4j Browser: http://localhost:7474 (user neo4j, password from NEO4J_PASSWORD).

services:
  neo4j:
    image: neo4j:2026.10.2-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphrag-lab-dev}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphrag-lab-dev}
    volumes:
      # Persist the LLM response cache across container restarts.
      - llm-cache:/app/.cache/llm
      # Downloaded embedding models, so they are fetched once.
      - hf-cache:/home/app/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
  llm-cache:
  hf-cache:
