# Local stack.
#   docker compose up -d falkordb   # graph store only (develop/test on the host)
#   docker compose up -d            # graph store + API on :8000
#
# FalkorDB Browser (graph explorer) is served on http://localhost:3000.

services:
  falkordb:
    image: falkordb/falkordb:v4.22.4
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    volumes:
      # Persist the LLM response cache across container restarts.
      - llm-cache:/app/.cache/llm
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb-data:
  llm-cache:
